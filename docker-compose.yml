services:
  agent:
    build:
      context: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: investigator-agent
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PROMETHEUS_PORT: "9464"
      AGENT_WORKSPACE: /data/workspace
      MAX_STEPS: ${MAX_STEPS:-12}
    command: ["${AGENT_QUESTION:-Create a research evidence note from the supplied question.}"]
    volumes:
      - agent_workspace:/data/workspace
    ports:
      - "9464:9464"
    depends_on:
      otel-collector:
        condition: service_started
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./collector-alerts.yml:/etc/prometheus/rules/collector-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - agent
      - otel-collector
    restart: unless-stopped

volumes:
  agent_workspace:
  prometheus_data:
